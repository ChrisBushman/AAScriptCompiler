name: Linux release build

# One-off/manual build for release packaging, not a permanent CI gate --
# same role as windows-release-build.yml, but for the native Linux CMake
# path (CMakeLists.txt has no platform-specific code at all; SC.C is
# plain ANSI C). Triggered by hand from the Actions tab or
# `gh workflow run linux-release-build.yml`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the asset to (blank = build a CI artifact only, don't publish)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure
        run: cmake -S . -B out/linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build AAScriptCompiler
        run: cmake --build out/linux --target AAScriptCompiler -j

      - name: Package release archive
        run: |
          STAGE=AAScriptCompiler-Linux
          mkdir -p "$STAGE"
          cp out/linux/AAScriptCompiler "$STAGE/"
          chmod +x "$STAGE/AAScriptCompiler"
          cp BLANK.SRC BLANK.SRP COMMAND.LST COMMAND.TXT EVENTS.LST \
             SCRIPT.INC STANDARD.INC TEMPLATE.SRC TEMPLATE.SRP "$STAGE/"
          tar czf AAScriptCompiler-Linux.tar.gz "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: AAScriptCompiler-Linux
          path: AAScriptCompiler-Linux.tar.gz
          if-no-files-found: error

      - name: Publish to release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" AAScriptCompiler-Linux.tar.gz --clobber
